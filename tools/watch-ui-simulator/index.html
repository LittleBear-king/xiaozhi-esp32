<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyWatch UI Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="workspace">
    <header class="toolbar">
      <div>
        <p class="eyebrow">MYWATCH / 410 x 502</p>
        <h1>UI Simulator</h1>
      </div>
      <div class="runtime-status"><span class="runtime-dot"></span>Interactive preview</div>
    </header>

    <section class="simulator-layout">
      <div class="device-stage" aria-label="Watch preview">
        <div class="watch-shell">
          <button class="crown" id="crownButton" type="button" title="Return to watch face"
                  aria-label="Return to watch face"></button>
          <div class="watch-screen" id="watchScreen">
            <div class="status-strip">
              <span id="networkStatus">Wi-Fi</span>
              <span class="battery"><span id="batteryFill"></span></span>
              <span id="batteryText">78%</span>
            </div>

            <section class="watch-face" id="watchFace">
              <p class="brand">MYWATCH</p>
              <time class="clock" id="clock">09:41</time>
              <p class="date" id="date">2026-09-26</p>
              <button class="talk-button" id="talkButton" type="button" aria-label="Start AI chat">
                <span>AI</span>
              </button>
              <p class="talk-hint">TAP TO TALK</p>
            </section>

            <section class="assistant-view is-hidden" id="assistantView" aria-live="polite">
              <p class="assistant-state" id="assistantState">LISTENING</p>
              <div class="voice-visual" id="voiceVisual" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <p class="assistant-message" id="assistantMessage">Listening...</p>
              <p class="assistant-caption" id="assistantCaption">Speak naturally</p>
            </section>
          </div>
        </div>
      </div>

      <aside class="control-panel" aria-label="Simulator controls">
        <section class="control-section">
          <h2>Device state</h2>
          <div class="state-grid" id="stateGrid">
            <button type="button" data-state="idle" class="is-active">Idle</button>
            <button type="button" data-state="connecting">Connecting</button>
            <button type="button" data-state="listening">Listening</button>
            <button type="button" data-state="speaking">Speaking</button>
            <button type="button" data-state="notification">Notification</button>
            <button type="button" data-state="error">Error</button>
          </div>
        </section>

        <section class="control-section">
          <h2>Preview data</h2>
          <label class="field-label" for="batteryRange">
            Battery <output id="batteryOutput">78%</output>
          </label>
          <input id="batteryRange" type="range" min="0" max="100" value="78">

          <label class="toggle-row" for="chargingToggle">
            <span>Charging</span>
            <input id="chargingToggle" type="checkbox">
          </label>

          <label class="field-label" for="messageInput">Message</label>
          <input id="messageInput" class="text-input" type="text"
                 value="Your reminder starts in 10 minutes" maxlength="72">
        </section>

        <section class="control-section state-readout">
          <h2>Runtime contract</h2>
          <dl>
            <div><dt>State</dt><dd id="stateReadout">idle</dd></div>
            <div><dt>Surface</dt><dd id="surfaceReadout">watch_face</dd></div>
            <div><dt>Action</dt><dd>ToggleChatState</dd></div>
          </dl>
        </section>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
